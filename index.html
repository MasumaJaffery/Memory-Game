<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mirrorbound — Storybook Memory Card Game</title>
    <meta name="description" content="A storybook memory card game with customizable deck themes, timed blitz mode, personal high scores, and global leaderboards." />
    <meta property="og:title" content="Mirrorbound — Storybook Memory Card Game" />
    <meta property="og:description" content="A storybook memory card game with customizable deck themes, timed blitz mode, personal high scores, and global leaderboards." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        function isExtensionError(filename, stack) {
          var src = String(filename || '') + ' ' + String(stack || '');
          return (
            src.indexOf('chrome-extension://') !== -1 ||
            src.indexOf('moz-extension://') !== -1 ||
            src.indexOf('safari-extension://') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (event) {
            var stack = event.error && event.error.stack;
            if (isExtensionError(event.filename, stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var stack = event.reason && event.reason.stack;
            if (isExtensionError('', stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
  </head>
  <body class="bg-[#1b0d1f] text-[#fffaf2] antialiased selection:bg-[#d9a648]/30 selection:text-[#fffaf2]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
