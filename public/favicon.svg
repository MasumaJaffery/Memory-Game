<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="frameGold" x1="12" y1="4" x2="52" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff0ad" />
      <stop offset="45%" stop-color="#eab349" />
      <stop offset="100%" stop-color="#b47519" />
    </linearGradient>
    <linearGradient id="mirrorGlass" x1="18" y1="10" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cce9ff" />
      <stop offset="75%" stop-color="#89c4fa" />
      <stop offset="100%" stop-color="#5d9ce6" />
    </linearGradient>
    <linearGradient id="mirrorShine" x1="20" y1="14" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Ornate mirror pedestal / handle -->
  <path d="M27 50h10l-1.5 7.5h-7L27 50Z" fill="url(#frameGold)" stroke="#8c5710" stroke-width="1" />
  <rect x="22" y="57" width="20" height="3.5" rx="1.75" fill="url(#frameGold)" stroke="#8c5710" stroke-width="1" />

  <!-- Outer ornate gold mirror frame -->
  <ellipse cx="32" cy="29.5" rx="19" ry="23" fill="url(#frameGold)" stroke="#8c5710" stroke-width="1.2" />

  <!-- Top crown jewel accent -->
  <path d="M32 3.5 35.6 8.2 32 11.4 28.4 8.2 32 3.5Z" fill="#fff7d6" stroke="#8c5710" stroke-width="1" />

  <!-- Inner warm gold bevel -->
  <ellipse cx="32" cy="29.5" rx="15" ry="19" fill="#c98b27" />

  <!-- Bright reflective mirror glass -->
  <ellipse cx="32" cy="29.5" rx="13.8" ry="17.8" fill="url(#mirrorGlass)" />

  <!-- Crisp diagonal reflection streaks -->
  <path
    d="M23 17.5c2.2-2.6 5.2-4 8.4-4.2L20.8 33.2c-.5-5.6.3-11.5 2.2-15.7Z"
    fill="url(#mirrorShine)"
  />
  <path
    d="M37.2 17.4 24.4 40.4c1 .7 2 1.2 3.2 1.6l11.8-21.2c-.6-1.3-1.3-2.4-2.2-3.4Z"
    fill="#ffffff"
    fill-opacity="0.55"
  />

  <!-- Sparkle star -->
  <path
    d="M40.5 21 41.5 23.4 44 24.4 41.5 25.4 40.5 27.8 39.5 25.4 37 24.4 39.5 23.4 40.5 21Z"
    fill="#ffffff"
  />
</svg>
